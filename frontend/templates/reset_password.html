<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choose a new password | Restaurant Cash Flow Analyzer</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
  <script src="{{ url_for('static', filename='js/script.js') }}" defer></script>
</head>
<body class="auth-page">
  <main class="auth-form">
    <a class="brand" href="/"><span class="brand-mark" aria-hidden="true">RC</span><span>Restaurant <strong>Cash Flow</strong></span></a>
    <h1>Choose a new password</h1>
    <p>Use at least 8 characters for your new password.</p>
    <form id="resetPasswordForm">
      <label for="newPassword">New password</label>
      <input type="password" id="newPassword" name="password" autocomplete="new-password" minlength="8" required>
      <label for="confirmPassword">Confirm new password</label>
      <input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" minlength="8" required>
      <button class="button button-primary" type="submit">Update password</button>
      <p class="auth-message" id="resetPasswordMessage" role="status" hidden></p>
    </form>
    <p class="auth-switch"><a href="/login">Back to sign in</a></p>
  </main>
</body>
</html>
