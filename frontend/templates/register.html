<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create account | Restaurant Cash Flow Analyzer</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
  <script src="{{ url_for('static', filename='js/script.js') }}" defer></script>
</head>
<body class="auth-page">
  <main class="auth-form">
    <a class="brand" href="/"><span class="brand-mark" aria-hidden="true">RC</span><span>Restaurant <strong>Cash Flow</strong></span></a>
    <h1>Set up your account</h1>
    <p>Start bringing your restaurant's financial picture into focus.</p>
    <form id="registerForm">
      <label for="regUsername">Username</label>
      <input type="text" id="regUsername" name="username" autocomplete="username" maxlength="80" required>
      <label for="regEmail">Email address</label>
      <input type="email" id="regEmail" name="email" autocomplete="email" maxlength="120" required>
      <label for="regPassword">Password</label>
      <input type="password" id="regPassword" name="password" autocomplete="new-password" minlength="8" required>
      <button class="button button-primary" type="submit">Create account</button>
      <p class="auth-error" id="errorMessage" role="alert" hidden></p>
      <p class="auth-switch">Already registered? <a href="/login">Sign in</a></p>
    </form>
  </main>
</body>
</html>
