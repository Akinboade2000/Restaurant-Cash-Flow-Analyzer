<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset password | Restaurant Cash Flow Analyzer</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
  <script src="{{ url_for('static', filename='js/script.js') }}" defer></script>
</head>
<body class="auth-page">
  <main class="auth-form">
    <a class="brand" href="/"><span class="brand-mark" aria-hidden="true">RC</span><span>Restaurant <strong>Cash Flow</strong></span></a>
    <h1>Forgot your password?</h1>
    <p>Enter the email address on your account and we'll send you a reset link.</p>
    <form id="forgotPasswordForm">
      <label for="resetEmail">Email address</label>
      <input type="email" id="resetEmail" name="email" autocomplete="email" maxlength="120" required>
      <button class="button button-primary" type="submit">Send reset link</button>
      <p class="auth-message" id="forgotPasswordMessage" role="status" hidden></p>
    </form>
    <p class="auth-switch"><a href="/login">Back to sign in</a></p>
  </main>
</body>
</html>
